version: "3"
services:
    api: 
        build: .
        container_name: fastapi_container
        ports:
            - "8000:8000"
        depends_on:
            - db
    db:
        image: postgres:15
        container_name: postgres_container
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: fastapi_db
        ports:
            - "5433:5432"

